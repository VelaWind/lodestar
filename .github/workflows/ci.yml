# Guards main. The three commands are the ones run locally before every commit,
# in the same order and with the same scripts — CI is not allowed to have its own
# idea of what "green" means.
#
# No deploy step: Vercel builds from the repository itself.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A newer push to the same branch makes an in-flight run irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 22 ships npm 10, and that is load-bearing rather than incidental.
      #
      # With vite 5, vitest 4 pulled its own vite 8, which lists esbuild as an
      # *optional* peer that vite 5 could not satisfy, so the tree needed a
      # second esbuild nested under vitest. npm 11 skips such entries and npm 10
      # refuses to install without them ("Missing: esbuild@… from lock file").
      # That bit twice (e0344de, and once more). Since vite 6, vitest uses the
      # project's own vite and the nested copy is gone.
      #
      # npm 10.9.9 also crashes building a fresh tree for this project
      # ("Cannot read properties of null (reading 'edgesOut')" in arborist's
      # peer-set loader), so the November 2026 dependency update was resolved
      # with npm 11. The rule that matters is the check: after any lockfile change,
      # run `npx -y npm@10 ci` from an empty node_modules. An incremental
      # `npm install` cannot see this class of failure, because node_modules is
      # already populated when it runs.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: the lockfile is the input, and a
      # dependency that drifted would otherwise be discovered in production.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Between typecheck and test on purpose: the linter's job here is
      # correctness rules the compiler does not cover (hook dependencies,
      # components created during render, logs left in shipped code), and
      # finding those before a five-second test run is cheaper than after.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Last, because it is the slowest and the least likely to fail on its own —
      # and because `npm run build` typechecks again, a build failure here means
      # something bundler-specific rather than a type error.
      - name: Build
        run: npm run build

  e2e:
    # The browser suite, on the two Chromium projects only (mobile-390x844 and
    # desktop-1280x800). They run every test; the three cross-engine projects
    # (WebKit, Firefox, mobile WebKit) run a subset, need two more browser
    # downloads and roughly double the time, so they stay a local check before
    # merging. This is what makes a component regression visible to CI: no
    # unit test renders a component.
    name: e2e (chromium)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Same Node as `verify`, for the same lockfile reason.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Against `vite preview`, as the local runs are: playwright.config.ts has
      # no webServer and reads the address from E2E_BASE_URL. The server is
      # started here, in the same step as the tests, and waited for.
      - name: Playwright (Chromium projects)
        env:
          E2E_BASE_URL: http://localhost:4173
        run: |
          npm run preview -- --port 4173 --strictPort > preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:4173/; then break; fi
            if [ "$attempt" -eq 60 ]; then cat preview.log; exit 1; fi
            sleep 1
          done
          npx playwright test --project=mobile-390x844 --project=desktop-1280x800 --reporter=list,html

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

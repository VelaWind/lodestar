# Guards main. The three commands are the ones run locally before every commit,
# in the same order and with the same scripts — CI is not allowed to have its own
# idea of what "green" means.
#
# No deploy step: Vercel builds from the repository itself.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A newer push to the same branch makes an in-flight run irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 22 ships npm 10, and that is load-bearing rather than incidental.
      #
      # vitest 4 pulls vite 8, which lists esbuild as an *optional* peer that
      # this project's own vite 5 cannot satisfy — so the tree needs a second
      # esbuild nested under vitest. npm 11 treats an unsatisfiable optional
      # peer as one it may skip and omits those entries; npm 10 expects them
      # and refuses to install without them. A lockfile written by npm 11 is
      # therefore one npm 10 rejects, with "Missing: esbuild@… from lock file".
      #
      # This has now bitten twice (e0344de, and again here). The rule: the
      # committed lockfile must be generated by the npm major this job runs.
      # If you have npm 11 locally, regenerate with `npx -y npm@10 install`
      # and verify with `npx -y npm@10 ci` from an empty node_modules — an
      # incremental `npm install` cannot see this class of failure, because
      # node_modules is already populated when it runs.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: the lockfile is the input, and a
      # dependency that drifted would otherwise be discovered in production.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Between typecheck and test on purpose: the linter's job here is
      # correctness rules the compiler does not cover (hook dependencies,
      # components created during render, logs left in shipped code), and
      # finding those before a five-second test run is cheaper than after.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Last, because it is the slowest and the least likely to fail on its own —
      # and because `npm run build` typechecks again, a build failure here means
      # something bundler-specific rather than a type error.
      - name: Build
        run: npm run build
